services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SQL_DB_NAME:-zyntheor}
      POSTGRES_USER: ${SQL_USER:-zyntheor_app}
      POSTGRES_PASSWORD: ${SQL_PASSWORD:-change_me_in_env}
    volumes:
      - zyntheor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SQL_USER:-zyntheor_app} -d ${SQL_DB_NAME:-zyntheor}"]
      interval: 10s
      timeout: 5s
      retries: 5

  object-storage:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-zyntheor_s3_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-change_me_s3_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - zyntheor_s3data:/data

  zyntheor-cloud:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      object-storage:
        condition: service_started
    ports:
      - "${PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      SQL_HOST: postgres
      SQL_DB_NAME: ${SQL_DB_NAME:-zyntheor}
      SQL_USER: ${SQL_USER:-zyntheor_app}
      SQL_PASSWORD: ${SQL_PASSWORD:-change_me_in_env}
      SQL_ADMIN_USER: ${SQL_ADMIN_USER:-${SQL_USER:-zyntheor_app}}
      SQL_ADMIN_PASSWORD: ${SQL_ADMIN_PASSWORD:-${SQL_PASSWORD:-change_me_in_env}}
      S3_BUCKET: ${S3_BUCKET:-zyntheor-checkpoints}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://object-storage:9000}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-zyntheor_s3_admin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-change_me_s3_secret}
      S3_CHECKPOINT_KEY: ${S3_CHECKPOINT_KEY:-checkpoints/model_checkpoint.pt}
      CHECKPOINT_STORAGE_PROVIDER: ${CHECKPOINT_STORAGE_PROVIDER:-s3}
      ZYNTHEOR_MASTER_SECRET: ${ZYNTHEOR_MASTER_SECRET:?Set ZYNTHEOR_MASTER_SECRET (>=32 chars)}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}

volumes:
  zyntheor_pgdata:
  zyntheor_s3data:
