
name: ZYNTHEOR Runtime Integrity

on:
  push:
    branches: [main, master]
    paths:
      - "qplus_native/**"
      - "native_data/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/runtime-integrity.yml"

  pull_request:
    branches: [main, master]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-validation:
    name: Native Runtime Verification
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f requirements-native.txt ]; then
            pip install -r requirements-native.txt
          fi
          pip install pytest

      - name: Validate native source
        run: |
          python -m compileall -q qplus_native

      - name: Verify checkpoint integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          candidates = [
              Path("native_data/model_checkpoint_target_41m.pt"),
              Path("native_data/model_checkpoint_target_41m_final.pt"),
          ]

          existing = [p for p in candidates if p.is_file()]

          if not existing:
              print("BLOCKED: No recognized checkpoint found")
          else:
              for path in existing:
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  print(f"CHECKPOINT: {path}")
                  print(f"SIZE: {path.stat().st_size}")
                  print(f"SHA256: {digest}")
          PY

      - name: Run runtime tests
        run: |
          if [ -d tests/runtime ]; then
            pytest -q tests/runtime
          else
            echo "::error::Runtime tests not found"
            exit 1
          fi

      - name: Verify runtime import
        run: |
          python -c "import qplus_native; print('Native package import successful')"

      - name: Report result
        if: success()
        run: echo "PASS: Configured runtime integrity tests completed"
