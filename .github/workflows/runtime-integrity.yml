name: runtime-integrity

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  runtime-integrity:
    name: Check Runtime Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-native.txt ]; then pip install -r requirements-native.txt; fi
          pip install pytest

      - name: Compile check qplus_native
        run: |
          python -m compileall qplus_native

      - name: Check model checkpoint files existence and hashes
        run: |
          python -c "
          import pathlib, hashlib
          paths = [
              pathlib.Path('native_data/model_checkpoint_target_4lm.pt'),
              pathlib.Path('native_data/model_checkpoint_target_4ln_final.pt')
          ]
          for path in paths:
              if not path.exists():
                  print(f'Warning: Checkpoint not found: {path}')
              else:
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  print(f'Checkpoint: {path}')
                  print(f'Size: {path.stat().st_size}')
                  print(f'SHA256: {digest}')
          "

      - name: Run runtime tests
        env:
          PYTHONPATH: .
        run: |
          if [ -d tests/runtime ]; then
            pytest -q tests/runtime
          else
            echo "No runtime tests directory found"
            exit 1
          fi

      - name: Test module import
        run: |
          python -c "import qplus_native; print('Module imported successfully')"

      - name: Success
        run: |
          echo "PASS: Runtime integrity check passed successfully"
