
name: ZYNTHEOR Python CI

on:
  push:
    branches: [main, master]
    paths:
      - "**.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - "setup.py"
      - ".github/workflows/python-ci.yml"

  pull_request:
    branches: [main, master]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-validation:
    name: Python Source Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      ZYNTHEOR_ENV: test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          if [ -f requirements-native.txt ]; then
            pip install -r requirements-native.txt
          fi

          pip install pytest pytest-cov ruff mypy

      - name: Compile Python source
        run: python -m compileall -q qplus_native

      - name: Ruff lint
        run: ruff check qplus_native

      - name: Python formatting check
        run: ruff format --check qplus_native

      - name: Static type analysis
        continue-on-error: true
        run: mypy qplus_native

      - name: Run unit tests
        run: |
          pytest -q tests \
            --ignore=tests/e2e \
            --ignore=tests/integration \
            --cov=qplus_native \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Verify native package import
        run: |
          python -c "import qplus_native; print('VERIFIED: qplus_native import')"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14
