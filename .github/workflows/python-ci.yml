name: ZYNTHEOR Native Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-python:
    name: Native Runtime Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python Sources
        run: |
          python -m compileall -q qplus_native
          echo "Python sources compiled successfully."

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements*.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip pytest
          if [ -f requirements-native.txt ]; then
            python -m pip install -r requirements-native.txt
          fi
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Run Python Tests (if any)
        run: |
          if find . -type f \( -name "test_*.py" -o -name "*_test.py" \) -not -path "./.git/*" -not -path "./node_modules/*" -not -path "./extracted/*" | grep -q .; then
            python -m pytest -q
          else
            echo "No Python test files found. Status: PARTIAL (compile-only)."
          fi
