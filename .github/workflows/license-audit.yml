name: ZYNTHEOR License Compliance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  license-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate License Report
        run: npx --yes license-checker --production --json --out license-report.json

      - name: Upload License Report
        uses: actions/upload-artifact@v7
        with:
          name: zyntheor-license-report
          path: license-report.json
          retention-days: 14
