
name: ZYNTHEOR Model Validation

on:
  push:
    branches: [main, master]
    paths:
      - "qplus_native/**"
      - "native_data/**"
      - "train_lm.py"
      - "eval_lm.py"
      - "requirements*.txt"
      - "tests/**"
      - ".github/workflows/model-validation.yml"

  pull_request:
    branches: [main, master]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-model-tests:
    name: NativeLM and Tokenizer Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          if [ -f requirements-native.txt ]; then
            python -m pip install -r requirements-native.txt
          fi

          python -m pip install pytest

      - name: Validate native source compilation
        run: |
          if [ ! -d qplus_native ]; then
            echo "::error::qplus_native directory not found"
            exit 1
          fi

          python -m compileall -q qplus_native

          for file in train_lm.py eval_lm.py qplus_native/train_lm.py qplus_native/eval_lm.py; do
            if [ -f "$file" ]; then
              python -m py_compile "$file"
            fi
          done

      - name: Discover model validation tests
        id: discover
        shell: bash
        run: |
          mapfile -t TEST_FILES < <(
            find . -type f \
              \( -name 'test_*.py' -o -name '*_test.py' \) \
              -not -path './.git/*' \
              -not -path './.venv/*' \
              | grep -Ei '(model|native|token|eval)' || true
          )

          if [ "${#TEST_FILES[@]}" -eq 0 ]; then
            echo "::error::No model, NativeLM, tokenizer, or evaluation tests found"
            echo "BLOCKED: Add real model validation tests before enabling this gate."
            exit 1
          fi

          printf '%s\n' "${TEST_FILES[@]}" > model-test-files.txt
          printf 'Discovered %s model validation test files\n' "${#TEST_FILES[@]}"
          cat model-test-files.txt

      - name: Run model validation tests
        env:
          PYTHONPATH: .
        run: |
          mapfile -t TEST_FILES < model-test-files.txt
          python -m pytest -q "${TEST_FILES[@]}" --tb=short

      - name: Report verified test result
        if: success()
        run: |
          echo "PASS: Discovered model validation tests completed successfully."
          echo "This result does not certify model quality or active checkpoint status."
