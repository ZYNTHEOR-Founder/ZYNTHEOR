
name: ZYNTHEOR Native Intelligence CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Native Core Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest

      - name: Validate Python syntax
        run: |
          python -m compileall -q .

      - name: Validate native model files
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              "qplus_native",
          ]

          for item in required:
              path = Path(item)
              if not path.exists():
                  raise SystemExit(f"BLOCKED: Missing {item}")
              print(f"OK: {item}")

          PY

      - name: Run native core tests
        run: |
          if [ -d tests ]; then
            pytest -q tests
          else
            echo "BLOCKED: No tests directory found"
            exit 1
          fi

      - name: Build frontend
        if: hashFiles('package.json') != ''
        run: |
          npm ci
          npm run build --if-present

      - name: CI result
        if: success()
        run: echo "PASS: All configured CI checks completed"
