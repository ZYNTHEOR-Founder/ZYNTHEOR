name: ZYNTHEOR CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zyntheor-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # No package-lock.json is committed; bun.lock exists. Use install with peer-deps tolerance.
      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Lint (TypeScript)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
