
name: ZYNTHEOR Training Validation

on:
  push:
    branches: [main, master]
    paths:
      - "qplus_native/**"
      - "native_data/**"
      - "train*.py"
      - "eval*.py"
      - "requirements*.txt"
      - "tests/training/**"
      - ".github/workflows/training-validation.yml"

  pull_request:
    branches: [main, master]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: training-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  training-integrity:
    name: Training Pipeline Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          if [ -f requirements-native.txt ]; then
            python -m pip install -r requirements-native.txt
          fi

          python -m pip install pytest

      - name: Validate training source
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          import sys

          candidates = [
              Path("train_lm.py"),
              Path("train_target.py"),
              Path("eval_lm.py"),
              Path("qplus_native/train_lm.py"),
              Path("qplus_native/train_target.py"),
              Path("qplus_native/eval_lm.py"),
          ]

          existing = [p for p in candidates if p.is_file()]

          if not existing:
              print("BLOCKED: No recognized training or evaluation entrypoint.")
              sys.exit(1)

          for path in existing:
              py_compile.compile(str(path), doraise=True)
              print(f"COMPILE OK: {path}")
          PY

          python -m compileall -q qplus_native

      - name: Validate dataset provenance metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          roots = [
              Path("native_data"),
              Path("datasets"),
              Path("data"),
          ]

          found = []
          for root in roots:
              if root.exists():
                  for pattern in ("*.json", "*.jsonl", "*.csv", "*.txt"):
                      found.extend(root.rglob(pattern))

          print(f"Dataset-related files discovered: {len(found)}")

          if not found:
              print("BLOCKED: No dataset files discovered.")
              print("Dataset provenance and license review remain unverified.")
          else:
              for path in found[:50]:
                  print(f"DATA FILE: {path}")
          PY

      - name: Verify checkpoint files
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          roots = [
              Path("native_data"),
              Path("checkpoints"),
          ]

          candidates = []
          for root in roots:
              if root.exists():
                  candidates.extend(
                      p for p in root.rglob("*")
                      if p.is_file() and (
                          p.suffix in {".pt", ".pth", ".ckpt", ".safetensors"}
                      )
                  )

          if not candidates:
              print("INFO: No checkpoint files committed to this repository.")
          else:
              for path in candidates:
                  digest = hashlib.sha256()
                  with path.open("rb") as stream:
                      for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                          digest.update(chunk)

                  print(f"CHECKPOINT: {path}")
                  print(f"SIZE_BYTES: {path.stat().st_size}")
                  print(f"SHA256: {digest.hexdigest()}")
          PY

      - name: Run training tests
        env:
          PYTHONPATH: .
        run: |
          if [ ! -d tests/training ]; then
            echo "::error::Training tests are not implemented."
            echo "BLOCKED: Add real training pipeline tests."
            exit 1
          fi

          python -m pytest -q tests/training --tb=short

      - name: Training validation result
        if: success()
        run: |
          echo "PASS: Training pipeline tests completed."
          echo "This does not certify training quality, dataset licensing,"
          echo "checkpoint readiness, or active runtime deployment."
