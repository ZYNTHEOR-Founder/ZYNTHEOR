<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" role="img" aria-labelledby="title desc">
  <title id="title">ZYNTHEOR Rainbow Neural Aurora</title>
  <desc id="desc">An animated emerald neural core surrounded by flowing rainbow aurora trails.</desc>
  <defs>
    <radialGradient id="core" cx="50%" cy="48%" r="56%"><stop offset="0" stop-color="#d8fff0" stop-opacity=".95"/><stop offset=".18" stop-color="#10b981" stop-opacity=".72"/><stop offset=".62" stop-color="#08785f" stop-opacity=".16"/><stop offset="1" stop-color="#071b18" stop-opacity="0"/></radialGradient>
    <linearGradient id="rainbow" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#ff5d79"/><stop offset=".17" stop-color="#ffb454"/><stop offset=".34" stop-color="#ffe66d"/><stop offset=".51" stop-color="#45e0a7"/><stop offset=".68" stop-color="#43c8ff"/><stop offset=".84" stop-color="#8b7cff"/><stop offset="1" stop-color="#f17bde"/></linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d4fff0"/><stop offset=".4" stop-color="#10b981"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="9" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <ellipse cx="300" cy="215" rx="210" ry="180" fill="url(#core)" opacity=".92"/>
  <g fill="none" stroke="url(#rainbow)" stroke-width="2.1" stroke-linecap="round" filter="url(#smallGlow)" opacity=".9">
    <path class="rainbow-trail trail-a" d="M53 229C105 36 219 29 300 105s160 157 247 11"/>
    <path class="rainbow-trail trail-b" d="M62 177C139 341 226 378 322 296s144-160 216-96"/>
    <path class="rainbow-trail trail-c" d="M85 304C145 121 242 84 319 153s122 201 198 185"/>
    <path class="rainbow-trail trail-d" d="M114 89c51 108 110 242 202 243s148-143 186-221"/>
  </g>
  <g fill="none" stroke="#42d9ab" stroke-opacity=".7" stroke-width="1.2">
    <ellipse cx="300" cy="215" rx="137" ry="75" transform="rotate(-28 300 215)"/>
    <ellipse cx="300" cy="215" rx="137" ry="75" transform="rotate(32 300 215)"/>
    <ellipse cx="300" cy="215" rx="137" ry="75" transform="rotate(90 300 215)"/>
  </g>
  <g stroke="url(#emerald)" fill="none" stroke-width="2.5" filter="url(#smallGlow)">
