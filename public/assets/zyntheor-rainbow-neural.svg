    <path d="M267 177h66M300 160v100M276 181l48 48M324 181l-48 48" stroke-linecap="round"/>
  </g>
  <circle cx="300" cy="193" r="41" fill="url(#core)" opacity=".9"/>
  <circle cx="300" cy="193" r="10" fill="#e5fff4" filter="url(#softGlow)"/>
  <g fill="#fff0bf" filter="url(#smallGlow)">
    <circle class="particle p1" cx="111" cy="135" r="3"/><circle class="particle p2" cx="464" cy="126" r="2.5"/><circle class="particle p3" cx="430" cy="318" r="3"/><circle class="particle p4" cx="155" cy="314" r="2"/><circle class="particle p5" cx="368" cy="73" r="2"/>
  </g>
