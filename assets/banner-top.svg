<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">ZYNTHEOR Vivid Intelligence — Aurora Banner</title>
  <desc id="desc">Flowing multicolor aurora ribbons and a radiant neural core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070B19"/><stop offset=".6" stop-color="#11142C"/><stop offset="1" stop-color="#09202D"/></linearGradient>
    <linearGradient id="spectrum"><stop stop-color="#00F0FF"/><stop offset=".2" stop-color="#397BFF"/><stop offset=".4" stop-color="#7B2CBF"/><stop offset=".6" stop-color="#FF007F"/><stop offset=".8" stop-color="#FF5E3A"/><stop offset="1" stop-color="#CCFF00"/></linearGradient>
    <radialGradient id="core"><stop stop-color="#fff"/><stop offset=".35" stop-color="#00F0FF" stop-opacity=".86"/><stop offset="1" stop-color="#FF007F" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-80%" y="-100%" width="260%" height="300%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#b9c7ff" stroke-opacity=".05"/></pattern>
  </defs>
  <style>
    .wave{animation:wave 11s ease-in-out infinite alternate;transform-origin:center}.spin{transform-origin:600px 103px;animation:spin 24s linear infinite}.pulse{animation:pulse 3.2s ease-in-out infinite;transform-origin:center}.spark{animation:spark 2.6s ease-in-out infinite alternate}
    @keyframes wave{from{transform:translateX(-24px);opacity:.45}to{transform:translateX(24px);opacity:.9}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{transform:scale(.9);opacity:.75}50%{transform:scale(1.1);opacity:1}}@keyframes spark{from{opacity:.2}to{opacity:1}}
    @media(prefers-reduced-motion:reduce){.wave,.spin,.pulse,.spark{animation:none!important}}
  </style>
  <rect width="1200" height="230" rx="24" fill="url(#bg)"/><rect width="1200" height="230" rx="24" fill="url(#grid)"/>
  <ellipse cx="600" cy="190" rx="540" ry="45" fill="url(#spectrum)" opacity=".25" filter="url(#glow)" class="wave"/>
  <path d="M-40 171C130 55 250 219 424 119s283-71 426 8 231 56 390-31" fill="none" stroke="url(#spectrum)" stroke-width="3" opacity=".66" filter="url(#glow)" class="wave"/>
  <path d="M-40 195C130 83 263 231 426 146s285-52 424 19 226 39 390-30" fill="none" stroke="url(#spectrum)" stroke-width="1.5" opacity=".42" class="wave"/>
  <g class="spin" fill="none" stroke="url(#spectrum)" stroke-width="1.3" opacity=".62"><ellipse cx="600" cy="103" rx="94" ry="34"/><ellipse cx="600" cy="103" rx="72" ry="49" transform="rotate(58 600 103)"/><ellipse cx="600" cy="103" rx="72" ry="49" transform="rotate(-58 600 103)"/></g>
  <circle cx="600" cy="103" r="42" fill="url(#core)" class="pulse" filter="url(#glow)"/><circle cx="600" cy="103" r="12" fill="#fff" opacity=".88" class="pulse" filter="url(#glow)"/>
  <g fill="#fff" filter="url(#glow)"><circle cx="91" cy="62" r="1.6" class="spark"/><circle cx="1090" cy="56" r="1.8" class="spark"/><circle cx="220" cy="177" r="1.5" class="spark"/><circle cx="980" cy="176" r="1.7" class="spark"/></g>
  <text x="600" y="48" text-anchor="middle" fill="#eef4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" letter-spacing="5">INTELLIGENCE WITHOUT BOUNDARIES</text>
  <text x="600" y="218" text-anchor="middle" fill="#c7d2f2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="4">ZYNTHEOR · VIVID INTELLIGENCE</text>
  <rect x=".75" y=".75" width="1198.5" height="228.5" rx="23.25" fill="none" stroke="url(#spectrum)" stroke-opacity=".42"/>
</svg>
