<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">ZYNTHEOR Rainbow Horizon</title>
  <desc id="desc">A flowing six-color light horizon with moving particles and a luminous constellation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070B19"/><stop offset=".5" stop-color="#10152D"/><stop offset="1" stop-color="#071C29"/></linearGradient>
    <linearGradient id="spectrum"><stop stop-color="#00F0FF"/><stop offset=".2" stop-color="#397BFF"/><stop offset=".4" stop-color="#7B2CBF"/><stop offset=".6" stop-color="#FF007F"/><stop offset=".8" stop-color="#FF5E3A"/><stop offset="1" stop-color="#CCFF00"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#c5d3ff" stroke-opacity=".05"/></pattern>
  </defs>
  <style>
    .drift{animation:drift 10s ease-in-out infinite alternate}.rotate{transform-box:fill-box;transform-origin:center;animation:rotate 28s linear infinite}.spark{animation:spark 2s ease-in-out infinite alternate}
    @keyframes drift{from{transform:translateX(-28px);opacity:.45}to{transform:translateX(28px);opacity:.9}}@keyframes rotate{to{transform:rotate(360deg)}}@keyframes spark{from{opacity:.15}to{opacity:1}}
    @media(prefers-reduced-motion:reduce){.drift,.rotate,.spark{animation:none!important}}
  </style>
  <rect width="1200" height="220" rx="24" fill="url(#bg)"/><rect width="1200" height="220" rx="24" fill="url(#grid)"/>
  <ellipse cx="600" cy="148" rx="540" ry="37" fill="url(#spectrum)" opacity=".25" filter="url(#blur)" class="drift"/>
  <path d="M-20 144Q140 72 294 135t306-5 300 4 320-25" fill="none" stroke="url(#spectrum)" stroke-width="2.4" opacity=".8" filter="url(#glow)" class="drift"/>
  <path d="M-20 163Q140 92 294 153t306-4 300 3 320-20" fill="none" stroke="url(#spectrum)" stroke-width="1.1" opacity=".5" class="drift"/>
  <g class="rotate" fill="none" stroke="url(#spectrum)" stroke-width="1.2" opacity=".55"><ellipse cx="600" cy="95" rx="110" ry="38"/><ellipse cx="600" cy="95" rx="66" ry="55" transform="rotate(52 600 95)"/><ellipse cx="600" cy="95" rx="66" ry="55" transform="rotate(-52 600 95)"/></g>
  <g fill="#fff" filter="url(#glow)"><circle cx="600" cy="95" r="4"/><circle cx="490" cy="95" r="2" class="spark"/><circle cx="710" cy="95" r="2.3" class="spark"/><circle cx="547" cy="49" r="1.6" class="spark"/><circle cx="653" cy="141" r="1.7" class="spark"/></g>
  <text x="600" y="40" text-anchor="middle" fill="#eaf0ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="4">CREATE · EXECUTE · VERIFY · DELIVER</text>
  <text x="600" y="203" text-anchor="middle" fill="#b9c8ed" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="4">ZYNTHEOR VIVID INTELLIGENCE</text>
  <rect x=".75" y=".75" width="1198.5" height="218.5" rx="23.25" fill="none" stroke="url(#spectrum)" stroke-opacity=".38"/>
</svg>
