
name: ZYNTHEOR API Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-integration:
    name: Native API Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONUNBUFFERED: "1"
      ZYNTHEOR_ENV: test
      ZYNTHEOR_API_TEST: "1"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest httpx

      - name: Validate API source
        run: |
          python -m compileall -q .

      - name: Discover API tests
        run: |
          if [ ! -d tests ]; then
            echo "BLOCKED: tests directory missing"
            exit 1
          fi

          find tests -type f \
            \( -iname '*api*' -o -iname '*integration*' \)

      - name: Run API tests
        run: |
          pytest -q tests \
            -k "api or endpoint or integration" \
            --junitxml=api-integration-results.xml

      - name: Validate API contracts
        run: |
          if [ -d tests/api ]; then
            pytest -q tests/api
          else
            echo "BLOCKED: tests/api directory missing"
            exit 1
          fi

      - name: Validate API security tests
        run: |
          if [ -d tests/security ]; then
            pytest -q tests/security
          else
            echo "BLOCKED: Security tests not configured"
            exit 1
          fi

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zyntheor-api-integration-results
          path: api-integration-results.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Integration result
        if: success()
        run: echo "PASS: API integration checks completed"
